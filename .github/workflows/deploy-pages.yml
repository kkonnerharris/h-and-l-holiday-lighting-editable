name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          NEXT_PUBLIC_BASE_PATH: ${{ vars.BASE_PATH }}
          NEXT_PUBLIC_GOOGLE_SHEETS_URL: ${{ vars.GOOGLE_SHEETS_URL }}
          NEXT_PUBLIC_GOOGLE_SHEET_URL: ${{ vars.GOOGLE_SHEET_URL }}
          NEXT_PUBLIC_NOTIFICATION_EMAIL: ${{ vars.NOTIFICATION_EMAIL }}
      - name: Verify static routes
        run: |
          test -s out/index.html
          test -s out/admin/index.html
          test -s out/404.html
          test -d out/_next/static
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
